spring.application.name=provacasy-backend
# Lokal auf 8081, weil Keycloak (Dev) Port 8080 belegt. Im Container setzt docker-compose SERVER_PORT=8080.
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/provacasy
spring.datasource.username=provacasy
spring.datasource.password=provacasy
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/hse
spring.mail.host=localhost
spring.mail.port=1025
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}