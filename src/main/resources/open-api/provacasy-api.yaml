openapi: 3.0.3
info:
  title: ProVaCaSy API
  description: >-
    Schnittstelle für die ProVaCaSy Webanwendung. Die API ist in der OpenAPI 3.0 Spezifikation beschrieben.
  version: 0.0.1
servers:
  - url: /api
tags:
  - name: users
    description: Benutzer und aktuelle Rolle
security:
  - bearerAuth: []
paths:
  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: Aktuell angemeldeten Benutzer abrufen
      responses:
        '200':
          description: Benutzer mit Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Fehler (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Role:
      type: string
      enum: [PROFESSOR, SECRETARIAT, DEAN]
    User:
      type: object
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
